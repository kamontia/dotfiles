os:
  editPreset: nvim
git:
  pagers:
    - colorArg: always
      pager: delta --color-only --features catppuccin-mocha
customCommands:
  - key: '<c-g>'
    context: 'commits,subCommits'
    description: '選択したコミット範囲を Diffview で開く (From^..To)'
    output: terminal
    command: 'nvim -c "DiffviewOpen {{.SelectedCommitRange.From}}^..{{.SelectedCommitRange.To}}"'
  - key: '<c-G>'
    context: 'commits,subCommits'
    description: '選択したコミット範囲を Diffview で開く (From~1..To)'
    output: terminal
    command: 'nvim -c "DiffviewOpen {{.SelectedCommitRange.From}}~1..{{.SelectedCommitRange.To}}"'
  - key: 'G'
    context: 'files'
    description: '選択したファイルの差分を Diffview で開く'
    output: terminal
    command: '~/.config/lazygit/scripts/open-diffview.sh "{{.SelectedFile.Name}}"'
